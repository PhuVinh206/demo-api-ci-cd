
name: Restful-Booker CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Newman
        run: npm install -g newman

      - name: 4. Run Postman Tests
        run: |
          newman run RestfulBooker_API_Collection.postman_collection.json \
            -e RestfulBooker_Env.postman_environment.json \
            -d booking_data.csv \
            --reporters cli,junit \
            --reporter-junit-export results.xml


      - name: 5. Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: results.xml
          if-no-files-found: ignore
